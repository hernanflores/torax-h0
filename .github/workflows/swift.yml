# Build y tests de los paquetes SPM del proyecto.
#
# No hay `Package.swift` en la raíz: el repositorio es un proyecto Xcode con
# los paquetes bajo `Packages/`, así que cada uno se invoca por su ruta.
# `swift test` ya compila lo que necesita, de ahí que no haya paso de build
# aparte.
name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Test Engine
      run: swift test --package-path Packages/Engine
    - name: Test MIDI
      run: swift test --package-path Packages/MIDI
